<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS205 Finals Practice Quiz 2 (Short)</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e2e0d8;
  --accent:#2f5fd0; --accent-soft:#e7eefc; --flag:#c7701a; --flag-soft:#fbefe2;
  --ok:#2e7d4f; --warn:#b3261e; --code:#f1efe9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151515; --card:#1f1f1f; --ink:#ecebe7; --muted:#a19f98; --line:#33322f;
    --accent:#7ea2ff; --accent-soft:#232c42; --flag:#f0a25a; --flag-soft:#3a2a1b;
    --ok:#6fcf97; --warn:#ff8a80; --code:#2a2a28;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1 1 auto}
.stat{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);position:sticky;top:0}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:20px 16px 80px}
nav{position:sticky;top:70px;align-self:start;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav a{display:flex;align-items:center;justify-content:center;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:13px;font-variant-numeric:tabular-nums}
nav a.done{background:var(--accent-soft);border-color:var(--accent)}
nav a.flag{box-shadow:inset 0 -3px 0 var(--flag)}
.legend{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;scroll-margin-top:80px}
.q.flagged{border-color:var(--flag)}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.qhead b{font-size:15px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.multi{background:var(--flag-soft);color:var(--flag)}
.qhead .sp{flex:1}
.flagbtn{font-size:12px;padding:3px 9px}
.q.flagged .flagbtn{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.stem p{margin:.5em 0}
.stem ul,.stem ol{margin:.4em 0;padding-left:1.4em}
pre{background:var(--code);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:13.5px;line-height:1.45}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
p code,li code{background:var(--code);padding:1px 4px;border-radius:4px}
table{border-collapse:collapse;margin:.6em 0;font-size:14.5px}
th,td{border:1px solid var(--line);padding:5px 10px;text-align:left}
th{background:var(--code)}
.stem{overflow-x:auto}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}

.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt input{margin-top:4px;flex:none}
.opt .l{font-weight:600;flex:none}
textarea{width:100%;min-height:220px;margin-top:10px;font:inherit;font-size:15px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.wc{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}

<!-- Question bank: same text as "Finals Practice Quiz 2 (Short) - Questions.md" -->
<script type="text/markdown" id="qsrc">
**Question 1** (2 points)

The CPU starts a DMA operation to read a 64KB block from disk into main memory. Which statement is TRUE while the transfer is in progress?

- a. The CPU is interrupted once for every word the DMA module moves, so that it can update the memory buffer pointer each time.
- b. The CPU must keep polling the DMA module's status register to find out when the transfer is complete.
- c. The CPU can keep executing other instructions, but may run slower when it needs the system bus.
- d. Because the DMA module moves the data itself, no interrupt is raised at any point of the transfer.

**Question 2** (2 points)

A process is in the Blocked/Suspend state: it is waiting for an I/O event, and its image has been swapped out to disk. The I/O event now occurs, but main memory is still full. Which state does the process move to?

- a. Ready/Suspend
- b. Ready
- c. Running
- d. Blocked

**Question 3** (2 points) (Select all that apply)

A process uses pure user-level threads (many-to-one model). It has 4 threads and runs on a 4-core machine. One of its threads calls a blocking `read()`. Which statements are TRUE?

- a. The other three threads keep running on the other three cores while the read is in progress.
- b. The kernel schedules the process as one entity and does not know that the process has 4 threads.
- c. The whole process is blocked until the read completes, unless a technique such as jacketing is used.
- d. Creating each of these threads required the kernel to create a matching kernel thread.
- e. Switching between these threads can be done by the thread library, without switching to kernel mode.

**Question 4** (2 points)

A system uses Highest Response Ratio Next (HRRN). The running process has just finished, and four processes are ready:

| Process | Time waited so far (w) | Expected service time (s) |
|---|---|---|
| P | 9 | 3 |
| Q | 14 | 4 |
| R | 2 | 1 |
| S | 20 | 10 |

Which process is selected next?

- a. S
- b. R
- c. P
- d. Q

**Question 5** (2 points)

Which statement about the Linux Completely Fair Scheduler (CFS) is TRUE?

- a. CFS keeps an active run queue and an expired run queue, and swaps them when the active queue becomes empty.
- b. CFS runs the process with the lowest vruntime, and a lower-priority process's vruntime grows faster for the same CPU time.
- c. CFS calculates a bonus from each process's sleep time and uses heuristics to raise the priority of interactive processes.
- d. After a timeout, CFS re-inserts the process into its red-black tree in constant O(1) time.

**Question 6** (2 points)

Two processes P0 and P1 share `boolean flag[2]`, both initially false. Process Pi (where j is the other process) runs:

```c
while (true) {
    flag[i] = true;
    while (flag[j])
        ;              /* busy wait */
    /* critical section */
    flag[i] = false;
    /* remainder section */
}
```

Which statement is correct?

- a. Mutual exclusion is violated, because both processes can pass the while loop together and be in their critical sections at the same time.
- b. All three requirements of the critical-section problem are met; the only drawback is busy waiting.
- c. Mutual exclusion holds, but if both processes set their flags before either checks, both wait forever, so progress fails.
- d. The processes keep setting and resetting their flags in step, so neither enters: this is livelock, but not deadlock.

**Question 7** (2 points)

A counting semaphore `s` is initialised to 2. `semWait` decrements the count and blocks the caller if the count becomes negative. `semSignal` increments the count and wakes one blocked process (FIFO) if the count is still ≤ 0. The following calls happen in order:

1. A calls `semWait(s)`
2. B calls `semWait(s)`
3. C calls `semWait(s)`
4. D calls `semWait(s)`
5. A calls `semSignal(s)`

What is the result after step 5?

- a. s = 0, and no process is blocked.
- b. s = −1; C is still blocked, and D is Ready because the signal wakes the most recent waiter.
- c. s = −2; C and D are both blocked.
- d. s = −1; C is Ready and D is still blocked.

**Question 8** (2 points) (Select all that apply)

Which statements about message passing are TRUE?

- a. With nonblocking send and blocking receive, the sender continues while the receiver waits for the message to arrive.
- b. In indirect communication, the sender must name the receiving process explicitly, as in `send(P, message)`.
- c. Blocking send with blocking receive (a rendezvous) gives tight synchronisation between the two processes.
- d. In a many-to-one setup, typical of a client-server system, the mailbox is often called a port.
- e. Message passing works by having the processes read and write shared variables that are protected by a semaphore.

**Question 9** (2 points) (Select all that apply)

Which statements about the readers-writers problem are TRUE?

- a. Under reader priority, readers must take turns, so only one reader can read the data at a time.
- b. Under reader priority, a writer can starve if new readers keep arriving.
- c. Under writer priority, an arriving writer pre-empts the readers that are already reading.
- d. Writer priority is considered fairer, because writers then have less chance of starving.
- e. A writer may write while readers are reading, as long as it updates a different record.

**Question 10** (2 points)

A system uses dynamic partitioning. The free holes, in address order, are:

10K, 4K, 20K, 18K, 7K, 9K, 12K, 15K

The most recent allocation was placed in the 4K hole, so next-fit continues scanning from there. A new process needs 8K. Which hole does each placement algorithm choose?

- a. First-fit: 10K; best-fit: 9K; next-fit: 20K
- b. First-fit: 10K; best-fit: 9K; next-fit: 9K
- c. First-fit: 20K; best-fit: 10K; next-fit: 20K
- d. First-fit: 10K; best-fit: 7K; next-fit: 18K

**Question 11** (2 points)

A process has 3 frames, initially empty. It references pages in this order:

1, 3, 0, 3, 5, 6, 3, 1, 0, 5

Using LRU replacement, how many page faults occur? Count the faults that happen while the frames are first being filled.

- a. 7
- b. 9
- c. 8
- d. 10

**Question 12** (2 points) (Select all that apply)

A running process references a page that is not in main memory. Which statements are TRUE?

- a. The OS places the faulting process in the Blocked state and issues a disk read for the page.
- b. The CPU busy-waits until the page arrives, because the faulting instruction cannot complete.
- c. When the disk interrupt arrives, the faulting process moves directly to the Running state.
- d. Another process can be dispatched while the disk I/O is in progress.
- e. If the page chosen for replacement has its modify (M) bit set, it must be written back to disk before its contents are dropped.

**Question 13** (2 points)

A disk has tracks 0 to 199. The head is at track 53, and the previous request was served at track 40. The request queue, in order of arrival, is:

98, 183, 37, 122, 14, 124, 65, 67

For SCAN, the arm travels to the last track (199) before reversing. For C-SCAN, it travels to track 199, then returns to track 0 (count this return) and scans upward again. Which statement is TRUE?

- a. SCAN gives the shortest total head movement, 331 tracks.
- b. SSTF gives the shortest total head movement, 236 tracks.
- c. SSTF gives the shortest total head movement, 208 tracks.
- d. C-SCAN gives the shortest total head movement, 382 tracks.

**Question 14** (2 points) (Select all that apply)

Which statements about solid state drives (SSDs) are TRUE?

- a. Reads and writes are done one page at a time, but erasing is done one block at a time.
- b. Wear leveling and garbage collection are mainly done by the operating system's file system.
- c. A stale page can be erased on its own and then rewritten in place.
- d. Write amplification happens when one write forces garbage collection to read, erase and rewrite blocks first.
- e. The SIO scheduler sorts requests by location to reduce seek time.

**Question 15** (2 points)

A Unix inode has 12 direct pointers, 1 single indirect, 1 double indirect and 1 triple indirect pointer. The block size is 1KB and each block pointer is 4 bytes. The inode is already in main memory. How many disk accesses are needed to read the byte at file offset 300,000?

- a. 3
- b. 2
- c. 1
- d. 4

**Question 16** (10 points)

A file currently has 50 blocks. The file allocation table (and, for indexed allocation, the index block) is already in main memory. Each block read or block write counts as one disk I/O.

(a) Complete the table with the number of disk I/O operations for each case. For contiguous allocation, assume there is no room to grow at the start of the file but there is room at the end. Indexed allocation uses fixed-size blocks.

| Operation | Contiguous | Chained | Indexed |
|---|---|---|---|
| (i) Add a block at the beginning | | | |
| (ii) Add a block after the 25th block | | | |
| (iii) Remove the 25th block | | | |

Justify each answer briefly.

(b) The disk is 64GB with 4KB blocks, and free space is tracked with a bit table (bitmap). How large is the bit table?

(c) Explain why chained allocation performs badly when a program reads the file in random order, and how indexed allocation avoids this.

**Question 17** (10 points)

A single-threaded process P calls `read()` for a disk block that is not in memory. The system uses DMA. Another process Q is in the Ready state.

(a) Describe, in order, what happens from the moment P calls `read()` until P continues after the call returns. State every change in the states of P and Q, and say where a mode switch and where a process switch happen.

(b) Identify one point in your sequence where a mode switch happens **without** a process switch.

(c) Suppose instead that P is one of four user-level threads in a process that uses the many-to-one model. What changes in your answer to (a)? Compare this with the one-to-one model.

(d) The system uses CFS. Explain why P is likely to run soon after its I/O completes, even though Q is a CPU-bound process that has been running.
</script>

<script>
(function(){
const STORE = 'cs205-finals-pq2-short-v1';
const $ = s => document.querySelector(s);

/* ---------- parse question bank ---------- */
function parseBank(src){
  const re = /^\*\*Question (\d+)\*\* \((\d+) points\)(.*)$/gm;
  const heads = [...src.matchAll(re)];
  return heads.map((h, k) => {
    const body = src.slice(h.index + h[0].length, k + 1 < heads.length ? heads[k+1].index : src.length);
    const lines = body.split('\n');
    const opts = [];
    let wordLimit = null;
    const stem = [];
    for (const line of lines){
      const m = line.match(/^- ([a-e])\. (.*)$/);
      const w = line.match(/^\*\*Word limit\*\*: Maximum (\d+) words\./);
      if (m) opts.push({ letter: m[1], text: m[2] });
      else if (w) wordLimit = +w[1];
      else stem.push(line);
    }
    const multi = /Select all/i.test(h[3]);
    return {
      n: +h[1], points: +h[2],
      type: opts.length ? (multi ? 'multi' : 'single') : 'long',
      stem: stem.join('\n').trim(), opts, wordLimit: opts.length ? null : (wordLimit || 250)
    };
  });
}

/* ---------- tiny markdown renderer ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inline(s){
  return s.split(/(`[^`]*`)/).map(part => {
    if (/^`[^`]*`$/.test(part)) return '<code>' + esc(part.slice(1, -1)) + '</code>';
    return esc(part).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }).join('');
}
function md(src){
  const L = src.split('\n'), out = [];
  let i = 0;
  const isBlock = l => /^(```|- |\d+\. |\|)/.test(l);
  while (i < L.length){
    const l = L[i];
    if (l.startsWith('```')){
      const buf = []; i++;
      while (i < L.length && !L[i].startsWith('```')) buf.push(L[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
    } else if (l.startsWith('|')){
      const rows = [];
      while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\|[\s:|-]+\|\s*$/.test(r));
      const [h, ...rest] = body;
      out.push('<table><thead><tr>' + cells(h).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rest.map(r => '<tr>' + cells(r).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
    } else if (l.startsWith('- ')){
      const items = [];
      while (i < L.length && L[i].startsWith('- ')) items.push(L[i++].slice(2));
      out.push('<ul>' + items.map(t => '<li>' + inline(t) + '</li>').join('') + '</ul>');
    } else if (/^\d+\. /.test(l)){
      const items = [];
      while (i < L.length && /^\d+\. /.test(L[i])) items.push(L[i++].replace(/^\d+\. /, ''));
      out.push('<ol>' + items.map(t => '<li>' + inline(t) + '</li>').join('') + '</ol>');
    } else if (!l.trim()){
      i++;
    } else {
      const buf = [];
      while (i < L.length && L[i].trim() && !isBlock(L[i])) buf.push(L[i++]);
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
    }
  }
  return out.join('');
}

const Q = parseBank($('#qsrc').textContent);

/* ---------- state ---------- */
let state = { answers: {}, flags: {}, started: Date.now() };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.answers) state = s; } catch(e){}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} scheduleFileSave(); };

/* ---------- autosave to .md file (File System Access API, Chrome/Edge) ---------- */
let fileHandle = null, fileReady = false, saveTimer = null;
const FS_OK = 'showSaveFilePicker' in window;
function idb(mode, fn){
  return new Promise((res, rej) => {
    const r = indexedDB.open('cs205-quiz-pq2-short', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { const tx = r.result.transaction('kv', mode); const req = fn(tx.objectStore('kv')); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); };
    r.onerror = () => rej(r.error);
  });
}
function setSaveStat(t){ const el = document.querySelector('#saveStat'); if (el) el.textContent = t; }
function scheduleFileSave(){
  if (!fileReady) return;
  clearTimeout(saveTimer);
  setSaveStat('Saving…');
  saveTimer = setTimeout(writeFile, 600);
}
async function writeFile(){
  if (!fileReady) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(buildMarkdown()); await w.close();
    setSaveStat(`Autosaved to ${fileHandle.name} ${new Date().toLocaleTimeString()}`);
  } catch(e){
    fileReady = false;
    setSaveStat('Autosave paused');
    document.querySelector('#btnLink').textContent = 'Resume autosave';
  }
}
async function linkFile(){
  if (!FS_OK){ toast('Autosave needs Chrome or Edge. Use Export instead.'); return; }
  try {
    if (fileHandle && !fileReady){
      // reuse the stored file; permission needs this click
      if (await fileHandle.requestPermission({ mode: 'readwrite' }) === 'granted'){ fileReady = true; afterLink(); return; }
    }
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'Finals Practice Quiz 2 (Short) Attempt.md',
      types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
    });
    try { await idb('readwrite', s => s.put(fileHandle, 'handle')); } catch(e){}
    fileReady = true; afterLink();
  } catch(e){ if (e.name !== 'AbortError') toast('Could not open file: ' + e.message); }
}
function afterLink(){
  document.querySelector('#btnLink').textContent = 'Change autosave file';
  writeFile();
}
async function restoreHandle(){
  if (!FS_OK){ setSaveStat('Autosave: Chrome/Edge only'); return; }
  try {
    const h = await idb('readonly', s => s.get('handle'));
    if (!h){ setSaveStat('Autosave off'); return; }
    fileHandle = h;
    if (await h.queryPermission({ mode: 'readwrite' }) === 'granted'){ fileReady = true; afterLink(); }
    else { setSaveStat(`Autosave paused (${h.name})`); document.querySelector('#btnLink').textContent = 'Resume autosave'; }
  } catch(e){ setSaveStat('Autosave off'); }
}

const words = s => (s.trim().match(/\S+/g) || []).length;
const isAnswered = q => {
  const a = state.answers[q.n];
  if (q.type === 'long') return !!(a && a.trim());
  if (q.type === 'multi') return Array.isArray(a) && a.length > 0;
  return !!a;
};

/* ---------- render ---------- */
function render(){
  const main = $('#quiz'), nav = $('#nav');
  main.innerHTML = ''; nav.innerHTML = '';
  for (const q of Q){
    const a = document.createElement('a');
    a.href = '#q' + q.n; a.textContent = q.n; a.id = 'nav' + q.n;
    nav.appendChild(a);

    const sec = document.createElement('section');
    sec.className = 'q'; sec.id = 'q' + q.n;
    const label = q.type === 'multi' ? '<span class="tag multi">Select all that apply</span>'
                : q.type === 'single' ? '<span class="tag">Choose one</span>'
                : `<span class="tag">Written · about ${q.wordLimit} words</span>`;
    sec.innerHTML = `<div class="qhead"><b>Question ${q.n}</b><span class="stat">${q.points} pts</span>${label}<span class="sp"></span><button class="flagbtn">⚑ Flag</button></div><div class="stem">${md(q.stem)}</div>`;

    if (q.type === 'long'){
      const ta = document.createElement('textarea');
      ta.placeholder = 'Type your answer…';
      ta.value = state.answers[q.n] || '';
      const wc = document.createElement('div'); wc.className = 'wc';
      const upd = () => {
        const n = words(ta.value);
        wc.textContent = `${n} / ${q.wordLimit} words` + (n > q.wordLimit ? ' — over guide' : '');
        wc.classList.toggle('over', n > q.wordLimit);
      };
      ta.addEventListener('input', () => { state.answers[q.n] = ta.value; upd(); save(); refresh(); });
      upd();
      sec.append(ta, wc);
    } else {
      const box = document.createElement('div'); box.className = 'opts';
      for (const o of q.opts){
        const lab = document.createElement('label'); lab.className = 'opt';
        const inp = document.createElement('input');
        inp.type = q.type === 'multi' ? 'checkbox' : 'radio';
        inp.name = 'q' + q.n; inp.value = o.letter;
        const cur = state.answers[q.n];
        inp.checked = q.type === 'multi' ? (cur || []).includes(o.letter) : cur === o.letter;
        inp.addEventListener('change', () => {
          if (q.type === 'multi'){
            state.answers[q.n] = [...box.querySelectorAll('input:checked')].map(x => x.value);
          } else state.answers[q.n] = o.letter;
          box.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x.querySelector('input').checked));
          save(); refresh();
        });
        lab.innerHTML = `<span class="l">${o.letter}.</span><span>${inline(o.text)}</span>`;
        lab.prepend(inp);
        lab.classList.toggle('sel', inp.checked);
        box.appendChild(lab);
      }
      const clr = document.createElement('button'); clr.className = 'clear'; clr.textContent = 'Clear choice';
      clr.addEventListener('click', () => {
        delete state.answers[q.n];
        box.querySelectorAll('input').forEach(x => x.checked = false);
        box.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
        save(); refresh();
      });
      sec.append(box, clr);
    }

    sec.querySelector('.flagbtn').addEventListener('click', () => {
      state.flags[q.n] = !state.flags[q.n]; save(); refresh();
    });
    main.appendChild(sec);
  }
  const lg = document.createElement('div'); lg.className = 'legend';
  lg.textContent = 'Blue = answered · orange underline = flagged';
  nav.appendChild(lg);
  refresh();
}

function refresh(){
  let done = 0;
  for (const q of Q){
    const ans = isAnswered(q); if (ans) done++;
    $('#nav' + q.n).classList.toggle('done', ans);
    $('#nav' + q.n).classList.toggle('flag', !!state.flags[q.n]);
    $('#q' + q.n).classList.toggle('flagged', !!state.flags[q.n]);
  }
  $('#prog').textContent = `${done}/${Q.length} answered`;
  $('#barfill').style.width = (100 * done / Q.length) + '%';
}

const fmtDur = ms => { const s = Math.floor(ms/1000); return `${Math.floor(s/3600)}h ${String(Math.floor(s/60)%60).padStart(2,'0')}m ${String(s%60).padStart(2,'0')}s`; };
setInterval(() => { $('#timer').textContent = '⏱ ' + fmtDur(Date.now() - state.started); }, 1000);

/* ---------- markdown export ---------- */
function buildMarkdown(){
  const now = new Date();
  const total = Q.reduce((s, q) => s + q.points, 0);
  const answered = Q.filter(isAnswered).length;
  const flagged = Q.filter(q => state.flags[q.n]).map(q => q.n);
  const out = [];
  out.push('# CS205 Finals Practice Quiz 2 (Short) - Student Attempt', '');
  out.push(`- Exported: ${now.toLocaleString()}`);
  out.push(`- Started: ${new Date(state.started).toLocaleString()} (elapsed ${fmtDur(now - state.started)})`);
  out.push(`- Answered: ${answered}/${Q.length}`);
  out.push(`- Flagged by student as unsure: ${flagged.length ? flagged.join(', ') : 'none'}`);
  out.push(`- Total marks available: ${total} (Q1-15: 2 pts each = 30; Q16-17: 10 pts each = 20)`, '');
  out.push('## Instructions for the marker', '');
  out.push('This file contains every question in full, all answer options, and the student\'s responses. **No answer key is included.**', '');
  out.push('1. For each question, work out the correct answer yourself from operating-systems knowledge (CS205: processes, scheduling, concurrency, memory, virtual memory, storage, file systems), or use a separately generated answer key.');
  out.push('2. **Choose one** questions: full marks for the correct letter, 0 otherwise.');
  out.push('3. **Select all that apply** questions: the student\'s exact set of ticked letters is given. Report both all-or-nothing marks and partial credit (+ per correct option ticked, - per wrong option ticked, floor 0), since the official scheme is unknown.');
  out.push('4. **Written** questions (10 pts, about 250 words, multi-part): the answer is copied verbatim in a text block. Split the 10 marks across the sub-parts (a), (b), ... sensibly, mark each part against what it asks for, give a score with a short justification, and note anything missing or wrong. For calculation parts, show the correct working. Word count is given; 250 words is a guide, not a hard limit.');
  out.push('5. Finish with a per-question score table, total score, and the topics to revise.', '');
  out.push('---', '');

  for (const q of Q){
    const typeLabel = q.type === 'multi' ? 'Select all that apply' : q.type === 'single' ? 'Choose one' : `Written answer, about ${q.wordLimit} words`;
    out.push(`## Question ${q.n} (${q.points} points) - ${typeLabel}${state.flags[q.n] ? ' - FLAGGED (student unsure)' : ''}`, '');
    out.push(q.stem, '');
    const a = state.answers[q.n];
    if (q.type === 'long'){
      const txt = (a || '').trim();
      if (!txt){ out.push('**Student answer:** _(no answer)_', ''); }
      else {
        out.push(`**Student answer** (${words(txt)} words${words(txt) > q.wordLimit ? ', over the ~' + q.wordLimit + '-word guide' : ''}):`, '');
        out.push('````text', txt, '````', '');
      }
    } else {
      out.push('**Options:**', '');
      q.opts.forEach(o => out.push(`- ${o.letter}. ${o.text}`));
      out.push('');
      const sel = q.type === 'multi' ? (a || []).slice().sort() : (a ? [a] : []);
      if (!sel.length) out.push('**Student answer:** _(no answer)_', '');
      else {
        out.push(`**Student answer:** ${sel.join(', ')}`, '');
        sel.forEach(l => { const o = q.opts.find(x => x.letter === l); out.push(`- (selected) ${l}. ${o ? o.text : ''}`); });
        if (q.type === 'multi'){
          const not = q.opts.filter(o => !sel.includes(o.letter)).map(o => o.letter);
          out.push(`- Not selected: ${not.length ? not.join(', ') : 'none'}`);
        }
        out.push('');
      }
    }
    out.push('---', '');
  }
  return out.join('\n');
}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

$('#btnExport').addEventListener('click', () => {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `Finals Practice Quiz 2 (Short) Attempt ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}.md`;
  const blob = new Blob([buildMarkdown()], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Saved ' + name);
});
$('#btnCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(buildMarkdown()); toast('Markdown copied'); }
  catch(e){ toast('Copy blocked - use Export instead'); }
});
$('#btnReset').addEventListener('click', () => {
  if (!confirm('Clear all answers, flags and the timer?')) return;
  state = { answers: {}, flags: {}, started: Date.now() }; save(); render(); window.scrollTo(0, 0);
});

$('#btnLink').addEventListener('click', linkFile);

window.__quiz = { Q, buildMarkdown };
render();
restoreHandle();
})();
</script>
